# Baut bei jedem Versions-Tag (z. B. v0.1.0) die App und stellt sie unter Releases bereit.
name: App bauen und veröffentlichen

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Geheime Dateien bereitstellen
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zeiterfassung.jks"

      - name: Testen und bauen
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/zeiterfassung.jks
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: gradle testDebugUnitTest assembleRelease --no-daemon

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Zeiterfassung-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "Zeiterfassung-${GITHUB_REF_NAME}.apk" \
            --title "Zeiterfassung ${GITHUB_REF_NAME}" \
            --notes "Zum Installieren die APK-Datei unten auf dem Handy antippen."
